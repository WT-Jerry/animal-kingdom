    <article class="panel" id="panel-intro" hidden>
      <p>這是《動物王國大探險展》語音導覽的入口。六大展區為森林、沙漠、海洋、草原、極地與史前生命。</p>
      <p>上方可播放前言導覽語音。逐字稿與語音內容相同。</p>
    </article>

    <article class="panel" id="panel-script">
      <p>這是一場橫跨億萬年地球生態的旅程，時間從現代的世界，回溯到恐龍統治的洪荒，從森林、沙漠、海洋、草原、極地到史前生命一共六大展區，包含了所有陸海空生命的繁衍軌跡，結合真實動物標本與沈浸式光影體驗，還原不同的生態場景，邀請觀展者一同體驗，走進地球不同的美麗角落，一次感受生命的多元樣貌。</p>
      <p>讓我們一起進入《動物王國大探險展》，開始與動物間的奇幻旅程。</p>
